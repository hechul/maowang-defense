<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0612" />
    <title>마왕키우기</title>
    <!-- OVERHAUL §4.2: 카이로 감성 8bit 폰트 (DungGeunMo 한글 + Press Start 2P 영문/숫자) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Gugi&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #05030f;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      }
      /* 첫 로딩 스플래시 — OVERHAUL §4.1: 카이로 감성 (따뜻한 호박 글로우) */
      #splash {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background:
          radial-gradient(ellipse 60% 40% at center, rgba(245,166,35,0.12) 0%, transparent 70%),
          radial-gradient(ellipse at center, #2a1745 0%, #05030f 75%);
        color: #F5A623; font-weight: bold; font-size: 14px; letter-spacing: 3px;
        z-index: 9999;
        text-shadow: 0 0 8px rgba(245,166,35,0.6);
      }
      #splash.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="splash">마왕키우기 로딩…</div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
